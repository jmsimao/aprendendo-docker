name: "docker-introdução"

services:
  database-mysql:
    image: mysql:latest
    container_name: mysql-container-01    
    restart: no # always
    environment:
      - MYSQL_ROOT_PASSWORD=root 
    volumes:
      - ".\\db\\mysql\\data:/var/lib/mysql"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  
  database-postgres:
    image: postgres:18.7
    container_name: postgres-container-01
    restart: no
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres 
    volumes:
      - ".\\db1\\postgresql\\18\\docker:/var/lib/postgresql/18/docker"
    ports: 
      - "5435:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "postgres"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s

  db-cache-redis:
    image: redis:8.10
    container_name: redis-container-01
    restart: no
    volumes:
      - ".\\redis\\data:/data"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 30s
      retries: 2
      start_period: 60s

  backend-node:
    image: node:26-slim
    container_name: node-container-01
    restart: no
    working_dir: /home/node/app
    volumes:
      - ".\\api\\app:/home/node/app"
    ports:
      - "9001:9001"
    command: npm start
    depends_on:
      db-cache-redis:
        condition: service_healthy
      database-mysql:
        condition: service_healthy
      database-postgres:
        condition: service_healthy

  website-php:
    image: php:8.2-apache
    container_name: php-container-01
    working_dir: /var/www/html
    volumes:
      - ".\\website\\html:/var/www/html"
    ports:
      - "8080:80"

