services:
  database: 
    image: mysql:latest 
    container_name: mysql-container-01
    restart: always
    volumes: 
      - "D:\\Docker\\docker-introducao\\db\\mysql\\data:/var/lib/mysql"
    ports: 
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  node:
    image: node:26-slim
    container_name: node-container-01
    restart: always
    working_dir: /home/node/app
    volumes:
      - "D:\\Docker\\docker-introducao\\api\\app:/home/node/app"
    ports:
      - "9001:9001"
    command: npm start
    depends_on:
      database:
        condition: service_healthy


    