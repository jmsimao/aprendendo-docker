services:
  db:
    image : mysql:latest
    container_name : mysql-cont-01
    restart : always
    environment : 
      MYSQL_ROOT_PASSWORD : root
    ports : 
      - "3306:3306"
    volumes : 
      - "d:\\Docker\\docker-introducao\\db\\mysql\\data:/var/lib/mysql"
    healthcheck :
      test: ["CMD", "mysqladmin", "ping",  "-h", "localhost"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  node:
    image : node:26-slim
    container_name : node-cont-01
    restart : always
    working_dir : "/home/node/app"
    ports : 
      - "9001:9001"
    volumes :
      - "d:\\Docker\\docker-introducao\\api\\app:/home/node/app"
    command: npm start
    depends_on :
      db : 
        condition : service_healthy
      




  